[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "echo 'STEP1: starting migration' && node_modules/.bin/prisma migrate deploy && echo 'STEP2: starting node' && node dist/index.js 2>&1; echo \"STEP3: node exited with $?\""
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
